<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>نظام محاسبة محل العطور</title>
<meta name="theme-color" content="#8a5a2b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="محاسبة العطور">
<link rel="manifest" href="manifest.json" crossorigin="use-credentials">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">

<style>
:root{--bg:#faf7f2;--cd:#fff;--tx:#2b2420;--mu:#7a6f66;--ac:#8a5a2b;--bd:#e6ddd1;--gd:#2e7d4f;--rd:#b3402f;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1713;--cd:#26201b;--tx:#f0e8de;--mu:#a89c90;--ac:#d9a066;--bd:#3a322b;--gd:#5fbf8a;--rd:#e5806f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1b1713;--cd:#26201b;--tx:#f0e8de;--mu:#a89c90;--ac:#d9a066;--bd:#3a322b;--gd:#5fbf8a;--rd:#e5806f;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Segoe UI",Tahoma,Arial,sans-serif;font-size:15px;max-width:720px;margin-inline:auto;padding:12px}
h1{font-size:19px;margin:6px 0 10px}h2{font-size:15px;margin:0 0 8px;color:var(--ac)}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:8px}
.tabs button{flex:none;background:var(--cd);color:var(--tx);border:1px solid var(--bd);border-radius:20px;padding:7px 14px;font:inherit;cursor:pointer}
.tabs button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.card{background:var(--cd);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:10px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.k{background:var(--cd);border:1px solid var(--bd);border-radius:12px;padding:10px}
.k small{color:var(--mu);display:block}.k b{font-size:17px}
label{display:block;font-size:13px;color:var(--mu);margin:6px 0 2px}
input,select,textarea{width:100%;padding:9px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn{margin-top:10px;width:100%;background:var(--ac);color:#fff;border:0;border-radius:8px;padding:10px;font:inherit;cursor:pointer}
.btn.s{background:var(--bd);color:var(--tx)}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:6px 5px;border-bottom:1px solid var(--bd);text-align:start;white-space:nowrap}th{color:var(--mu);font-weight:600}
.l{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px dashed var(--bd)}
.g{color:var(--gd)}.r{color:var(--rd)}.mu{color:var(--mu);font-size:13px}
#msg{min-height:20px;margin:4px 0;font-size:14px}
body.locked>*:not(#lock){display:none!important}#lock{display:none}body.locked #lock{display:block}
</style></head><body class="locked">
<h1>🧴 نظام محاسبة محل العطور</h1>
<div class="tabs" id="tabs"></div><div id="msg"></div><div id="app"></div>
<div id="lock"><div class="card" style="margin-top:18vh;text-align:center"><div style="font-size:42px">🔒</div><h2 id="lt"></h2>
<input id="p1" type="password" inputmode="numeric" autocomplete="off" placeholder="الرمز">
<input id="p2" type="password" inputmode="numeric" autocomplete="off" placeholder="تأكيد الرمز" style="margin-top:8px">
<button class="btn" id="lb" onclick="submitPin()"></button><div id="le" class="r" style="margin-top:8px"></div></div></div>
<script>
const K='perfume_acc_v1';let S=null;
try{S=JSON.parse(localStorage.getItem(K))}catch(e){}
S=S||{cur:'د.أ',capital:[],mats:[],purchases:[],prods:[],sales:[],exps:[]};
let tab='sum',rst=false;
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
const $=i=>document.getElementById(i),n=v=>parseFloat(v)||0;
const f=v=>(Math.round(v*100)/100).toLocaleString('en'),m=v=>f(v)+' '+S.cur;
const sum=(a,fn)=>a.reduce((s,x)=>s+fn(x),0);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,5);
const today=()=>new Date().toISOString().slice(0,10);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const TN={oil:'زيت',alcohol:'كحول',container:'قنينة فارغة'},un=t=>t==='container'?'حبة':'مل';
const avg=x=>x&&x.qty>0?x.cost/x.qty:0;
const msg=(t,ok)=>{$('msg').innerHTML='<span class="'+(ok?'g':'r')+'">'+t+'</span>'};
const TABS=[['sum','الملخص'],['cap','رأس المال'],['stk','المخزون'],['mk','القناني والمبيعات'],['exp','المصاريف']];

function calc(){const c=sum(S.capital,x=>x.amt),rev=sum(S.sales,x=>x.qty*x.price),cogs=sum(S.sales,x=>x.cogs),ex=sum(S.exps,x=>x.amt),pu=sum(S.purchases,x=>x.cost),raw=sum(S.mats,x=>x.cost),fin=sum(S.prods,x=>x.qty*x.cost);
return{c,rev,cogs,ex,gp:rev-cogs,net:rev-cogs-ex,raw,fin,inv:raw+fin,cash:c+rev-pu-ex,eq:c+rev-cogs-ex}}
const cl=v=>v<0?'r':'g';
const opts=(t,none)=>(none?'<option value="">— بدون —</option>':'')+S.mats.filter(x=>x.type===t).map(x=>'<option value="'+x.id+'">'+esc(x.name)+' (متوفر '+f(x.qty)+' '+un(t)+')</option>').join('');

const V={
sum(){const c=calc();return `
<div class="grid">
<div class="k"><small>رأس المال</small><b>${m(c.c)}</b></div>
<div class="k"><small>حقوق الملكية (رأس المال + الربح)</small><b>${m(c.eq)}</b></div>
<div class="k"><small>قيمة المخزون</small><b>${m(c.inv)}</b></div>
<div class="k"><small>المبيعات</small><b>${m(c.rev)}</b></div>
<div class="k"><small>النقد المتوفر</small><b class="${cl(c.cash)}">${m(c.cash)}</b></div>
<div class="k"><small>صافي الربح</small><b class="${cl(c.net)}">${m(c.net)}</b></div></div>
<div class="card" style="margin-top:10px"><h2>قائمة الدخل</h2>
<div class="l"><span>المبيعات</span><span>${m(c.rev)}</span></div>
<div class="l"><span>تكلفة البضاعة المباعة</span><span>- ${m(c.cogs)}</span></div>
<div class="l"><span>مجمل الربح</span><span class="${cl(c.gp)}">${m(c.gp)}</span></div>
<div class="l"><span>المصاريف</span><span>- ${m(c.ex)}</span></div>
<div class="l"><b>صافي الربح</b><b class="${cl(c.net)}">${m(c.net)}</b></div></div>
<div class="card"><h2>الميزانية</h2>
<div class="l"><span>نقد</span><span>${m(c.cash)}</span></div>
<div class="l"><span>مخزون مواد خام</span><span>${m(c.raw)}</span></div>
<div class="l"><span>مخزون قناني جاهزة</span><span>${m(c.fin)}</span></div>
<div class="l"><b>إجمالي الأصول</b><b>${m(c.cash+c.inv)}</b></div>
<div class="l"><span>رأس المال</span><span>${m(c.c)}</span></div>
<div class="l"><span>صافي الربح</span><span>${m(c.net)}</span></div>
<div class="l"><b>إجمالي حقوق الملكية</b><b>${m(c.eq)}</b></div></div>
<div class="card"><h2>إعدادات ونسخة احتياطية</h2>
<label>رمز العملة</label><input id="cur" value="${esc(S.cur)}" onchange="S.cur=this.value||'د.أ';save();render()">
<textarea id="bk" rows="3" placeholder="هون بتظهر النسخة الاحتياطية، أو الصقها لتستعيد بياناتك"></textarea>
<div class="row"><button class="btn s" onclick="$('bk').value=JSON.stringify(S)">تصدير</button><button class="btn s" onclick="imp()">استيراد</button></div>
<button class="btn s" onclick="reset()">${rst?'اضغط مرة ثانية لتأكيد حذف كل البيانات':'مسح كل البيانات'}</button>
<div class="row"><button class="btn s" onclick="lockUI('login')">قفل الآن</button><button class="btn s" onclick="lockUI('change')">تغيير رمز القفل</button></div>
<p class="mu">البيانات محفوظة في متصفحك فقط، خذ نسخة احتياطية بين فترة وفترة.</p></div>`},
cap(){return `<div class="card"><h2>${S.capital.length?'إضافة على رأس المال (تطوير المحل)':'رأس المال الافتتاحي'}</h2>
<label>المبلغ</label><input id="ca" type="number" inputmode="decimal">
<label>ملاحظة</label><input id="cn" placeholder="${S.capital.length?'مثلاً: توسعة المحل':'رأس المال الأساسي'}">
<button class="btn" onclick="addCap()">إضافة</button></div>
<div class="card"><h2>سجل رأس المال — الإجمالي ${m(calc().c)}</h2><div class="tw"><table><tr><th>التاريخ</th><th>المبلغ</th><th>ملاحظة</th></tr>
${S.capital.map(x=>`<tr><td>${x.d}</td><td>${m(x.amt)}</td><td>${esc(x.note)}</td></tr>`).join('')}</table></div></div>`},
stk(){return `<div class="card"><h2>شراء مواد (يخصم من النقد)</h2>
<label>اسم المادة</label><input id="bn" list="ml" placeholder="مثلاً: زيت عود">
<datalist id="ml">${S.mats.map(x=>'<option value="'+esc(x.name)+'">').join('')}</datalist>
<label>النوع</label><select id="bt"><option value="oil">زيت (مل)</option><option value="alcohol">كحول (مل)</option><option value="container">قنينة فارغة (حبة)</option></select>
<div class="row"><div><label>الكمية</label><input id="bq" type="number" inputmode="decimal"></div><div><label>إجمالي السعر</label><input id="bc" type="number" inputmode="decimal"></div></div>
<button class="btn" onclick="buy()">إضافة للمخزون</button></div>
<div class="card"><h2>مخزون المواد — ${m(calc().raw)}</h2><div class="tw"><table><tr><th>المادة</th><th>النوع</th><th>الكمية</th><th>التكلفة/وحدة</th><th>القيمة</th></tr>
${S.mats.map(x=>`<tr><td>${esc(x.name)}</td><td>${TN[x.type]}</td><td>${f(x.qty)} ${un(x.type)}</td><td>${f(avg(x))}</td><td>${m(x.cost)}</td></tr>`).join('')}</table></div></div>`},
mk(){const ps=S.prods.filter(p=>p.qty>0);return `<div class="card"><h2>تصنيع قنينة عطر</h2>
<label>اسم العطر</label><input id="pn">
<label>الزيت</label><select id="po">${opts('oil')}</select>
<div class="row"><div><label>مل زيت / قنينة</label><input id="pom" type="number" inputmode="decimal"></div><div><label>عدد القناني</label><input id="pc" type="number" value="1"></div></div>
<label>الكحول</label><select id="pa">${opts('alcohol')}</select>
<label>مل كحول / قنينة</label><input id="pam" type="number" inputmode="decimal">
<label>القنينة الفارغة (اختياري)</label><select id="pb">${opts('container',1)}</select>
<label>سعر البيع للقنينة</label><input id="ps" type="number" inputmode="decimal">
<button class="btn" onclick="make()">تصنيع وخصم من المخزون</button></div>
<div class="card"><h2>مبيعات اليوم (إدخال دفعة وحدة)</h2><label>التاريخ</label><input id="dd" type="date" value="${today()}">
${ps.length?`<div class="tw"><table><tr><th>العطر</th><th>متوفر</th><th>المباع</th><th>السعر</th></tr>${ps.map(p=>`<tr><td>${esc(p.name)}</td><td>${p.qty}</td><td><input id="dq_${p.id}" type="number" inputmode="numeric" min="0" placeholder="0" oninput="dayCalc()" style="width:70px"></td><td><input id="dp_${p.id}" type="number" inputmode="decimal" value="${p.sell||''}" oninput="dayCalc()" style="width:80px"></td></tr>`).join('')}</table></div><p id="dt" class="mu"></p><button class="btn" onclick="daySave()">حفظ مبيعات اليوم</button>`:'<p class="mu">ما في قناني جاهزة للبيع</p>'}</div>
<div class="card"><h2>بيع منفرد</h2><label>القنينة</label><select id="sp" onchange="pre()"><option value="">— اختر —</option>${ps.map(p=>'<option value="'+p.id+'">'+esc(p.name)+' (متوفر '+p.qty+')</option>').join('')}</select>
<div class="row"><div><label>الكمية</label><input id="sq" type="number" value="1"></div><div><label>سعر البيع للقنينة</label><input id="sr" type="number" inputmode="decimal"></div></div>
<button class="btn" onclick="sell()">تسجيل بيع</button></div>
<div class="card"><h2>القناني الجاهزة</h2><div class="tw"><table><tr><th>العطر</th><th>مل (زيت+كحول)</th><th>متوفر</th><th>التكلفة</th><th>البيع</th></tr>
${S.prods.map(p=>`<tr><td>${esc(p.name)}</td><td>${f(p.oil)}+${f(p.alc)}</td><td>${p.qty}</td><td>${f(p.cost)}</td><td>${f(p.sell)}</td></tr>`).join('')}</table></div></div>
<div class="card"><h2>سجل المبيعات</h2><div class="tw"><table><tr><th>التاريخ</th><th>العطر</th><th>الكمية</th><th>المبلغ</th><th>الربح</th></tr>
${S.sales.map(x=>{const p=x.qty*x.price-x.cogs;return `<tr><td>${x.d}</td><td>${esc(x.name)}</td><td>${x.qty}</td><td>${f(x.qty*x.price)}</td><td class="${cl(p)}">${f(p)}</td></tr>`}).join('')}</table></div></div>`},
exp(){return `<div class="card"><h2>إضافة مصروف</h2><label>البيان</label><input id="ed" placeholder="إيجار، كهرباء، رواتب...">
<label>المبلغ</label><input id="ea" type="number" inputmode="decimal"><button class="btn" onclick="addExp()">إضافة</button></div>
<div class="card"><h2>المصاريف — ${m(calc().ex)}</h2><div class="tw"><table><tr><th>التاريخ</th><th>البيان</th><th>المبلغ</th></tr>
${S.exps.map(x=>`<tr><td>${x.d}</td><td>${esc(x.desc)}</td><td>${m(x.amt)}</td></tr>`).join('')}</table></div></div>`}
};
function render(){$('tabs').innerHTML=TABS.map(t=>`<button class="${t[0]===tab?'on':''}" onclick="tab='${t[0]}';rst=false;$('msg').innerHTML='';render()">${t[1]}</button>`).join('');$('app').innerHTML=V[tab]()}
function done(t){save();render();msg(t,1)}
function addCap(){const a=n($('ca').value);if(a<=0)return msg('أدخل مبلغاً صحيحاً');S.capital.push({d:today(),amt:a,note:$('cn').value.trim()||(S.capital.length?'إضافة':'رأس مال افتتاحي')});done('تمت الإضافة')}
function buy(){const name=$('bn').value.trim(),type=$('bt').value,q=n($('bq').value),c=n($('bc').value);if(!name||q<=0||c<0)return msg('أكمل الاسم والكمية والسعر');
let x=S.mats.find(y=>y.name===name&&y.type===type);if(!x){x={id:uid(),name,type,qty:0,cost:0};S.mats.push(x)}x.qty+=q;x.cost+=c;S.purchases.push({d:today(),id:x.id,cost:c});done('تمت إضافة المادة للمخزون')}
function make(){const g=i=>S.mats.find(x=>x.id===$(i).value),o=g('po'),a=g('pa'),b=g('pb'),cnt=Math.floor(n($('pc').value))||1,om=n($('pom').value),am=n($('pam').value),name=$('pn').value.trim();
if(!name||!o||!a||om<=0||am<0)return msg('أكمل الاسم واختر الزيت والكحول وحدد الكميات');
if(o.qty<om*cnt)return msg('الزيت غير كافٍ في المخزون');if(a.qty<am*cnt)return msg('الكحول غير كافٍ في المخزون');if(b&&b.qty<cnt)return msg('القناني الفارغة غير كافية');
const ao=avg(o),aa=avg(a),ab=avg(b),cost=om*ao+am*aa+ab;
o.qty-=om*cnt;o.cost-=om*cnt*ao;a.qty-=am*cnt;a.cost-=am*cnt*aa;if(b){b.qty-=cnt;b.cost-=cnt*ab}
S.prods.push({id:uid(),name,oil:om,alc:am,qty:cnt,cost,sell:n($('ps').value)});done('تم التصنيع، تكلفة القنينة '+f(cost)+' '+S.cur)}
function pre(){const p=S.prods.find(x=>x.id===$('sp').value);if(p)$('sr').value=p.sell}
function sell(){const p=S.prods.find(x=>x.id===$('sp').value),q=Math.floor(n($('sq').value)),pr=n($('sr').value);if(!p||q<=0||pr<=0)return msg('اختر القنينة وأدخل الكمية والسعر');if(q>p.qty)return msg('الكمية أكبر من المتوفر');
p.qty-=q;S.sales.push({d:today(),name:p.name,qty:q,price:pr,cogs:q*p.cost});done('تم البيع، الربح '+f(q*(pr-p.cost))+' '+S.cur)}
function addExp(){const a=n($('ea').value),d=$('ed').value.trim();if(a<=0||!d)return msg('أكمل البيان والمبلغ');S.exps.push({d:today(),desc:d,amt:a});done('تمت إضافة المصروف')}
function imp(){try{const o=JSON.parse($('bk').value);if(!o.capital||!o.mats)throw 0;S=o;save();render();msg('تمت الاستعادة',1)}catch(e){msg('النسخة غير صالحة')}}
function reset(){if(!rst){rst=true;render();return}S={cur:S.cur,capital:[],mats:[],purchases:[],prods:[],sales:[],exps:[]};rst=false;save();render()}
function dayCalc(){let r=0,c=0;S.prods.forEach(p=>{const a=$('dq_'+p.id),b=$('dp_'+p.id);if(!a||!b)return;const q=Math.floor(n(a.value));if(q>0){r+=q*n(b.value);c+=q*p.cost}});const e=$('dt');if(e)e.textContent='الإجمالي: '+m(r)+' — الربح: '+m(r-c)}
function daySave(){const d=$('dd').value||today(),rows=[];for(const p of S.prods){if(p.qty<=0)continue;const q=Math.floor(n($('dq_'+p.id).value)),pr=n($('dp_'+p.id).value);if(q<=0)continue;if(q>p.qty)return msg('الكمية أكبر من المتوفر: '+esc(p.name));if(pr<=0)return msg('أدخل سعر البيع: '+esc(p.name));rows.push([p,q,pr])}
if(!rows.length)return msg('ما في مبيعات مدخلة');let r=0,pf=0;rows.forEach(([p,q,pr])=>{p.qty-=q;S.sales.push({d,name:p.name,qty:q,price:pr,cogs:q*p.cost});r+=q*pr;pf+=q*(pr-p.cost)});done('تم تسجيل مبيعات اليوم: '+f(r)+' '+S.cur+'، الربح '+f(pf)+' '+S.cur)}
render();
const PK='perfume_pin_v1';let mode='login',fails=0,until=0,hiddenAt=0;
const hs=async p=>{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('perfume:'+p));return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,'0')).join('')};
const gp=()=>{try{return localStorage.getItem(PK)}catch(e){return null}};
function lockUI(md){mode=md;document.body.classList.add('locked');$('lt').textContent=md==='login'?'أدخل رمز القفل':md==='setup'?'أنشئ رمز قفل (4 أرقام على الأقل)':'أدخل رمز القفل الجديد';
$('p2').style.display=md==='login'?'none':'block';$('lb').textContent=md==='login'?'فتح':'حفظ الرمز';$('p1').value=$('p2').value='';$('le').textContent=''}
async function submitPin(){const a=$('p1').value,e=$('le');
if(mode==='login'){if(Date.now()<until){e.textContent='انتظر قليلاً ثم حاول مرة ثانية';return}
if(await hs(a)===gp()){fails=0;document.body.classList.remove('locked')}else{fails++;until=Date.now()+Math.min(fails*3,60)*1000;e.textContent='الرمز غير صحيح'}return}
if(a.length<4){e.textContent='الرمز لازم 4 أرقام على الأقل';return}
if(a!==$('p2').value){e.textContent='الرمزان غير متطابقين';return}
try{localStorage.setItem(PK,await hs(a))}catch(x){e.textContent='تعذر حفظ الرمز';return}
document.body.classList.remove('locked')}
['p1','p2'].forEach(i=>$(i).addEventListener('keydown',e=>{if(e.key==='Enter')submitPin()}));
document.addEventListener('visibilitychange',()=>{if(document.hidden)hiddenAt=Date.now();else if(hiddenAt&&Date.now()-hiddenAt>30000&&gp())lockUI('login')});
lockUI(gp()?'login':'setup');
